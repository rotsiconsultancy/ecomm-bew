<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In | Bewama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/bewama-ui.css" />
</head>
<body>
  <main class="page" style="display:grid;place-items:center;padding:32px;background:linear-gradient(135deg,var(--navy-900),var(--navy));">
    <section class="card panel" style="width:min(480px,100%);padding:32px;">
      <a href="index.html"><img src="../../public/logo.png" alt="Bewama" style="width:220px;margin:0 auto 24px;" /></a>
      <p class="kicker" style="text-align:center;">Buyer account</p>
      <h1 class="section-title" style="text-align:center;font-size:34px;">Sign in to reorder faster.</h1>
      <p class="section-copy" style="text-align:center;margin-left:auto;margin-right:auto;">Access order history, saved quote requests, delivery details, and repeat procurement lists.</p>
      <form class="grid" style="margin-top:24px;" action="profile.html">
        <div class="field"><label>Email address</label><input class="input" type="email" required placeholder="you@company.com" /></div>
        <div class="field"><label>Password</label><input class="input" type="password" required placeholder="Enter password" /></div>
        <button class="btn btn--orange btn--wide" type="submit">Sign In</button>
        <a class="btn btn--ghost btn--wide" href="productListing.html">Continue as Guest</a>
      </form>
      <p style="margin:20px 0 0;text-align:center;color:var(--muted);font-size:13px;font-weight:700;">Admin preview remains available from the admin-facing dashboard.</p>
    </section>
  </main>
</body>
</html>
