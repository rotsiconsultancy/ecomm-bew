<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Quote - Bewama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-3xl mx-auto py-12 px-4">
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
            <div class="bg-[#003366] p-8 text-white">
                <h1 class="text-3xl font-bold">Request a Bulk Quote</h1>
                <p class="text-blue-100 mt-2">Fill out the form below and our team will get back to you with a custom quote.</p>
            </div>

            <form action="quoteSubmitted.html" class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#ec5b13] focus:border-[#ec5b13]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Company Name</label>
                        <input type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#ec5b13] focus:border-[#ec5b13]">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#ec5b13] focus:border-[#ec5b13]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                        <input type="tel" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#ec5b13] focus:border-[#ec5b13]">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Product(s) of Interest</label>
                    <textarea required rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#ec5b13] focus:border-[#ec5b13]" placeholder="e.g. 500 units of Industrial Pump X-200"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Additional Requirements</label>
                    <textarea rows="4" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#ec5b13] focus:border-[#ec5b13]"></textarea>
                </div>

                <div class="flex items-center justify-between pt-4">
                    <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-[#003366]">Cancel</a>
                    <button type="submit" class="bg-[#ec5b13] text-white py-3 px-8 rounded-md font-bold hover:bg-[#d44d0f] transition duration-200 shadow-md">
                        Submit Quote Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
