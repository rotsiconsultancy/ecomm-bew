<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Content Management | Bewama Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#ec5b13", "secondary": "#003366", "background-light": "#f8f6f6", "background-dark": "#221610" },
                    fontFamily: { "display": ["Public Sans", "sans-serif"] },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Public Sans', sans-serif; }
        .sidebar-item-active { background-color: rgba(236, 91, 19, 0.1); border-left: 4px solid #ec5b13; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-secondary text-white flex-shrink-0 hidden lg:flex flex-col border-r border-secondary/20">
            <div class="p-6 flex items-center gap-3">
                <div class="bg-primary p-2 rounded-lg"><span class="material-symbols-outlined text-white">factory</span></div>
                <div><h1 class="text-xl font-bold tracking-tight">BEWAMA</h1><p class="text-xs text-slate-300">Industrial Solutions</p></div>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-1">
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="dashboard.html">
                    <span class="material-symbols-outlined">dashboard</span><span class="font-medium">Dashboard</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="product-management.html">
                    <span class="material-symbols-outlined">inventory_2</span><span class="font-medium">Products</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="product-management.html">
                    <span class="material-symbols-outlined">warehouse</span><span class="font-medium">Inventory</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="order-management.html">
                    <span class="material-symbols-outlined">shopping_cart</span><span class="font-medium">Orders</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="quote-management.html">
                    <span class="material-symbols-outlined">request_quote</span><span class="font-medium">Quotes</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="user-management.html">
                    <span class="material-symbols-outlined">group</span><span class="font-medium">Users</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl sidebar-item-active text-primary" href="content-management.html">
                    <span class="material-symbols-outlined">article</span><span class="font-medium">Content</span>
                </a>
            </nav>
            <div class="p-4 border-t border-white/10">
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-colors text-slate-200" href="admin-settings.html">
                    <span class="material-symbols-outlined">settings</span><span class="font-medium">Settings</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white dark:bg-background-dark/50 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-bold text-secondary">Content Management</h2>
            </header>
            <div class="flex-1 overflow-y-auto p-8 text-center py-20">
                <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">article</span>
                <h3 class="text-2xl font-bold text-slate-400">Content Management Module</h3>
                <p class="text-slate-500">Standardized layout applied. CMS features pending.</p>
            </div>
        </main>
    </div>
</body>
</html>
